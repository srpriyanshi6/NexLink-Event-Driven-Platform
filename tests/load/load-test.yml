# k6 load test configuration

options:
  stages:
    - duration: 30s
      target: 20
    - duration: 1m
      target: 50
    - duration: 30s
      target: 0
  
  thresholds:
    http_req_duration: ["p(95)<500"]
    http_req_failed: ["rate<0.01"]

scenarios:
  - name: "User Registration Flow"
    exec: "registerUser"
    executor: "ramping-vus"
    startVUs: 0
    stages:
      - duration: "30s"
        target: 10
      - duration: "1m"
        target: 10
      - duration: "30s"
        target: 0